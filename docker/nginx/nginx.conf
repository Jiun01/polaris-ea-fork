server {
    # Dual-stack: prod-net is dual-stack (IPv6 for polaris-api's Supabase egress),
    # so polaris-api's booking httpx calls (EA_API_BASE_URL=http://ea-nginx:80) can
    # resolve ea-nginx to its AAAA. httpx is a hard-fail client (no Happy-Eyeballs):
    # a v4-only nginx => refused AAAA => intermittent booking-API failures. Listen
    # on both families. (default_server lives on the v4 listen.)
    listen 80 default_server;
    listen [::]:80;

    server_name localhost;

    client_max_body_size 128M;

    access_log /var/log/nginx/application.access.log;

    root /var/www/html;
    
    index index.php index.html;
    
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
        
    location ~ ^.+.php {
        fastcgi_pass php-fpm:9000;
        fastcgi_split_path_info ^(.+?.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "error_log=/var/log/nginx/application_php_errors.log";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_index index.php;
        include fastcgi_params;
    }
    
    location ~ /\.ht {
        deny all;
    }
}
