services:
  php-fpm:
    build: docker/php-fpm
    working_dir: /var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - POLARIS_EA_JWT_SECRET=e2e-test-secret-at-least-32-bytes!!
      - POLARIS_WEBHOOK_SECRET=e2e-webhook-secret
      # EA self-configures config.php from these on boot (docker-entrypoint.sh).
      # The defaults target ea-mysql/eauser, but this dev stack's db service is
      # `mysql`/`user`, so they MUST be set explicitly or the app can't connect.
      - EA_DB_HOST=mysql
      - EA_DB_NAME=easyappointments
      - EA_DB_USER=user
      - EA_DB_PASSWORD=password
      - EA_AUTO_MIGRATE=true
      # Public base URL EA bakes into customer-facing links. MUST differ from the
      # request host (playwright BASE_URL → nginx :8090) so the reset-link E2E in
      # tests/e2e/provisioning.spec.ts is meaningful, not vacuous.
      - EA_BASE_URL=https://calendar.test
      # Transactional mail → mailpit (plain SMTP, no TLS/auth) so the provisioning
      # reset email is captured by the suite instead of failing in PHP mail().
      - EA_SMTP_HOST=mailpit
      - EA_SMTP_PORT=1025
      - EA_SMTP_CRYPTO=none
      - EA_SMTP_USER=
      - EA_SMTP_FROM_ADDRESS=noreply@getpolaris.my
    depends_on:
      - mysql
      - mailpit
    volumes:
      - '.:/var/www/html'
      - './docker/php-fpm/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini'

  nginx:
    image: 'nginx:1.27-alpine'
    working_dir: /var/www/html
    volumes:
      - '.:/var/www/html'
      - './docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
    ports:
      - '${NGINX_PORT:-8090}:80'

  mysql:
    image: 'mysql:8.0'
    volumes:
      - './docker/mysql:/var/lib/mysql'
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=easyappointments
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    ports:
      - '${MYSQL_PORT:-3306}:3306'

  phpmyadmin:
    image: 'phpmyadmin:5.2.1'
    ports:
      - '${PHPMYADMIN_PORT:-8080}:80'
    environment:
      - 'PMA_HOST=mysql'
      - 'UPLOAD_LIMIT=102400K'

  mailpit:
    image: 'axllent/mailpit:v1.7'
    ports:
      - '${MAILPIT_HTTP_PORT:-8026}:8025'
      - '${MAILPIT_SMTP_PORT:-1026}:1025'

  swagger-ui:
    platform: linux/amd64
    image: swaggerapi/swagger-ui:v5.10.5
    ports:
      - "${SWAGGER_UI_PORT:-8001}:8080"
    volumes:
      - ./openapi.yml:/usr/share/nginx/html/openapi.yml
    environment:
      API_URL: openapi.yml
  
  baikal:
    image: ckulka/baikal:0.10.1-apache
    ports:
      - "${BAIKAL_PORT:-8100}:80"
    volumes:
      - ./docker/baikal:/var/www/html
      - ./docker/baikal/config:/var/www/baikal/config
      - ./docker/baikal/data:/var/www/baikal/Specific
  
  openldap:
    image: osixia/openldap:1.5.0
    hostname: openldap
    ports:
      - "${OPENLDAP_PORT:-389}:389"
      - "${OPENLDAP_SSL_PORT:-636}:636"
    volumes:
      - ./docker/openldap/certificates:/container/service/slapd/assets/certs
      - ./docker/openldap/slapd/database:/var/lib/ldap
      - ./docker/openldap/slapd/config:/etc/ldap/slapd.d
    environment:
      - LDAP_ORGANISATION=example
      - LDAP_DOMAIN=example.org
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=admin
      - LDAP_CONFIG_PASSWORD=config_pass
      - "LDAP_BASE_DN=dc=example,dc=org"
      - LDAP_READONLY_USER=true
      - LDAP_READONLY_USER_USERNAME=user
      - LDAP_READONLY_USER_PASSWORD=password

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    hostname: phpldapadmin
    ports:
      - "${PHPLDAPADMIN_PORT:-8200}:80"
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_HTTPS=false
    depends_on:
      - openldap

